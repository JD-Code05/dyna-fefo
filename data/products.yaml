# shelf_life_ref_hours and q10 are a log-linear fit of data/shelf_life_by_temperature.csv
# (synthetic, generated by the team with an LLM from the research paper; 10 samples x 11 temperatures
# per product). backend/tests/test_dataset_fit.py checks the model stays within 10% of the data.
products:
  - id: chicken-breast # raw_chicken in the CSV
    name: Fresh chicken breast
    shelf_life_ref_hours: 168
    t_ref_c: 4
    q10: 2.97
    rate_floor: 0.5
    max_dt_hours: 1.0
    salvage_ratio: 0.10
    dispatch_ratio: 0.50
  - id: fresh-milk # fresh_milk in the CSV
    name: Fresh milk
    shelf_life_ref_hours: 235
    t_ref_c: 4
    q10: 2.46
    rate_floor: 0.5
    max_dt_hours: 1.0
    salvage_ratio: 0.10
    dispatch_ratio: 0.50
  - id: tomato-dish # tomato_based_dish in the CSV
    name: Tomato-based dish
    shelf_life_ref_hours: 131
    t_ref_c: 4
    q10: 1.98
    rate_floor: 0.5
    max_dt_hours: 1.0
    salvage_ratio: 0.10
    dispatch_ratio: 0.50
