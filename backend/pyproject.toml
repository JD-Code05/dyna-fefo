[project]
name = "dynafefo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "paho-mqtt>=2,<3",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120  # the codebase's existing style

[tool.ruff.lint]
# B008: FastAPI Depends() idiom; EXE002: bind-mount file modes on Windows; UP046: keep pydantic Generic[T] style
ignore = ["B008", "EXE002", "UP046"]
