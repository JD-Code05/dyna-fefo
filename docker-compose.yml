services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dynafefo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dynafefo}
      POSTGRES_DB: ${POSTGRES_DB:-dynafefo}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./infra/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dynafefo}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/mosquitto/start.sh:/mosquitto/config/start.sh:ro
    # start.sh hashes these into the broker's password file; device passwords are the device keys
    environment:
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD:-dev-only-mqtt-ingest-password}
      MQTT_DEVICES: ${MQTT_DEVICES:-esp32-chiller-01:dev-key-01 esp32-chiller-02:dev-key-02 esp32-chiller-03:dev-key-03}
    entrypoint: ["sh", "/mosquitto/config/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u ingest -P \"$$MQTT_INGEST_PASSWORD\" -t '$$SYS/#' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dynafefo}:${POSTGRES_PASSWORD:-dynafefo}@db:5432/${POSTGRES_DB:-dynafefo}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dynafefo}:${POSTGRES_PASSWORD:-dynafefo}@db:5432/dynafefo_test
      MQTT_HOST: mqtt
      SIM_MODE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      # Unset = the dev defaults in app/core/config.py (documented in .env.example)
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-before-sharing}
      DEMO_SUPERVISOR_PASSWORD: ${DEMO_SUPERVISOR_PASSWORD:-Supervisor-Demo-2026}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-Staff-Demo-2026}
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    command: sh -c "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dynafefo}:${POSTGRES_PASSWORD:-dynafefo}@db:5432/${POSTGRES_DB:-dynafefo}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dynafefo}:${POSTGRES_PASSWORD:-dynafefo}@db:5432/dynafefo_test
      MQTT_HOST: mqtt
      SIM_MODE: "true"
      MQTT_USERNAME: ingest
      MQTT_PASSWORD: ${MQTT_INGEST_PASSWORD:-dev-only-mqtt-ingest-password}
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    command: python -m app.worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  simulator:
    build: ./simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt
      SCENARIO: ${SCENARIO:-normal}
      SIM_SPEEDUP: ${SIM_SPEEDUP:-1}
      DEVICE_ID: esp32-chiller-01
      DEVICE_KEY: ${DEVICE_KEY_A:-dev-key-01}
      ZONE_ID: chiller-a
      BASE_TEMP_C: 2 # chicken: PNS/BAFS 103:2016 poultry chillers 0-4 C
      BASE_HUMIDITY_PCT: 88 # simulated, display only
    depends_on:
      mqtt:
        condition: service_healthy
      api:
        condition: service_healthy

  simulator-b:
    build: ./simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt
      SCENARIO: ${SCENARIO_B:-normal}
      SIM_SPEEDUP: ${SIM_SPEEDUP:-1}
      DEVICE_ID: esp32-chiller-02
      DEVICE_KEY: ${DEVICE_KEY_B:-dev-key-02}
      ZONE_ID: chiller-b
      BASE_TEMP_C: 3.5 # milk: PNS/BAFS 210:2017 not more than 4 C
      BASE_HUMIDITY_PCT: 80 # simulated, display only
    depends_on:
      mqtt:
        condition: service_healthy
      api:
        condition: service_healthy

  simulator-c:
    build: ./simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt
      SCENARIO: ${SCENARIO_C:-normal}
      SIM_SPEEDUP: ${SIM_SPEEDUP:-1}
      DEVICE_ID: esp32-chiller-03
      DEVICE_KEY: ${DEVICE_KEY_C:-dev-key-03}
      ZONE_ID: chiller-c
      BASE_TEMP_C: 3 # tomato dish (ready-to-eat): no BAFS standard; US FDA Food Code 5 C
      BASE_HUMIDITY_PCT: 75 # simulated, display only
    depends_on:
      mqtt:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    profiles: ["ui"]
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dbdata:
