services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dynafefo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dynafefo}
      POSTGRES_DB: ${POSTGRES_DB:-dynafefo}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./infra/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dynafefo}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dynafefo}:${POSTGRES_PASSWORD:-dynafefo}@db:5432/${POSTGRES_DB:-dynafefo}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dynafefo}:${POSTGRES_PASSWORD:-dynafefo}@db:5432/dynafefo_test
      MQTT_HOST: mqtt
      SIM_MODE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dynafefo}:${POSTGRES_PASSWORD:-dynafefo}@db:5432/${POSTGRES_DB:-dynafefo}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dynafefo}:${POSTGRES_PASSWORD:-dynafefo}@db:5432/dynafefo_test
      MQTT_HOST: mqtt
      SIM_MODE: "true"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    command: python -m app.worker
    depends_on:
      api:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mqtt
      SCENARIO: ${SCENARIO:-normal}
      SIM_SPEEDUP: ${SIM_SPEEDUP:-1}
      DEVICE_ID: esp32-chiller-01
      ZONE_ID: chiller-a
    depends_on:
      mqtt:
        condition: service_healthy

volumes:
  dbdata:
